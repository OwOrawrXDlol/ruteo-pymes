# Parámetros de operación y costo.
# Cada valor dice si es REAL (dato de la empresa) o SUPUESTO (Tabla 5 del artículo).
# Cuando la empresa entregue sus datos, cambia el valor y su etiqueta a "real".

almacen:
  lat: 20.1011            # supuesto: centro de Pachuca, cambiar por la dirección real del almacén
  lon: -98.7591           # supuesto

flota:
  camionetas_propias: 4   # supuesto (Tabla 5)
  capacidad_cajas: 110    # supuesto (Tabla 5): camioneta de 1.5 t
  max_urgentes: 10        # supuesto: tope de fletes urgentes disponibles en un día

tiempos:
  jornada_h: 9            # supuesto (Tabla 5): incluye traslado y servicio
  servicio_min: 6         # supuesto (Tabla 5): descarga y firma por parada
  velocidad_kmh: 22       # supuesto (Tabla 5): velocidad urbana promedio
  hora_salida: "08:00"    # supuesto: hora a la que salen las camionetas del almacén

distancias:
  factor_circuidad: 1.30  # supuesto (Tabla 5): km por calle / km en línea recta

costos:
  costo_km: 4.20          # supuesto (Tabla 5), MXN/km: combustible y mantenimiento
  costo_propia: 1100      # supuesto (Tabla 5), MXN/día por camioneta propia que sale
  tarifa_reservada: 1500  # supuesto (Tabla 5), MXN/día, se paga aunque no se use
  tarifa_urgente: 3200    # supuesto (Tabla 5), MXN/día, contratada el mismo día

reserva:
  q_alfa: 1.025           # supuesto (artículo, ec. 3): margen por error del pronóstico
  u_max: 0.95             # supuesto (Tabla 5): llenado máximo alcanzable de una camioneta
  semanas_historia: 4     # supuesto: semanas previas para el pronóstico sustituto

solver:
  segundos_por_dia: 4     # supuesto (Tabla 5): tiempo de búsqueda de OR-Tools por día

trafico:
  # Valores por omisión de un incidente simulado (modo B). No son datos medidos: solo sirven para la demo.
  simulado:
    radio_m: 300            # supuesto: un tramo a menos de esta distancia del incidente queda afectado
    factor: 2.5             # supuesto: un tramo afectado tarda 2.5 veces más
    minutos_cerrado: 1000   # supuesto: tiempo de un tramo cerrado (más que la jornada, así no se usa)
  # Criterios para decidir qué camionetas reoptimizar (TRAFICO.md). Valores iniciales razonables,
  # no calibrados con datos de la empresa.
  umbral_retraso_pct: 15        # supuesto: retraso mínimo, en % del manejo sin tráfico que le falta...
  umbral_retraso_min: 10        # supuesto: ...y además al menos estos minutos (se piden las dos)
  magnitud_minima: 3            # supuesto: incidente "mayor" en la escala 0-4 de TomTom
  radio_incidente_m: 300        # supuesto: incidente a menos de esto de un tramo pendiente cuenta
  mejora_minima_min: 5          # supuesto: el plan nuevo se adopta solo si ahorra al menos esto
  segundos_reoptimizar: 2       # supuesto: tiempo de búsqueda de OR-Tools al reoptimizar

tomtom:
  # Modo A (tráfico en vivo). La clave va en .env como TOMTOM_API_KEY (ver .env.example).
  minutos_cache: 5              # supuesto (TRAFICO.md): reusar la misma consulta durante 5 min
  modo_viaje: car               # supuesto: "van" está en beta en TomTom y Matrix no lo acepta
  max_transacciones_matrix: 500 # supuesto: tope por cálculo, para no gastar la cuota del mes en uno
  margen_bbox_km: 1             # supuesto: margen del recuadro en que se buscan incidentes
  radio_estimado_m: 150         # supuesto: alcance de un incidente al estimar tramos que TomTom no midió
  factor_por_magnitud:          # supuesto: lentitud estimada según la magnitud del incidente
    0: 1.2                      # supuesto: desconocida
    1: 1.2                      # supuesto: menor
    2: 1.5                      # supuesto: moderada
    3: 2.5                      # supuesto: mayor
    4: 2.5                      # supuesto: indefinida (los cierres se tratan como tramo cerrado)
  limite_mensual:               # dato de TomTom: plan gratuito (docs.tomtom.com/pricing, revisado 12/11/2026)
    routing: 20000            # real (dato publicado por TomTom, no de la empresa)
    incidentes: 2500          # real (dato publicado por TomTom, no de la empresa)
    matrix: 2500              # real (dato publicado por TomTom, no de la empresa)
